name: pr-validation

on:
  pull_request:
    branches: 
    - '*'

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v1
    - name: smoke test
      run: source ./src/nb.sh
      env:
        CI: true
        NB_PROFILE: "z"
    - name: Run ShellCheck
      uses: Azbagheri/shell-linter@latest
      with:
        path: "src"